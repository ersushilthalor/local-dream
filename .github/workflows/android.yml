name: Build APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # compileSdk = 37 looks for platforms/android-37. SDK Manager
          # currently installs this platform under the android-37.0 name.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testBasicDebugUnitTest \
            :app:testFilterDebugUnitTest \
            --stacktrace

      - name: Build Basic and Filter debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:assembleBasicDebug \
            :app:assembleFilterDebug \
            --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: local-dream-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
